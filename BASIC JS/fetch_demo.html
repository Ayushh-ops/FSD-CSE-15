<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch</title>
    <style>
        table{
            width:80vw;
            border-collapse: collapse;
        }
        th,td{
            border: 2px solid black;
            text-align: center;
        }
        #message {
          text-align: center;
          margin: 15px;
          font-size: 18px;
          font-weight: bold;
        }
        #orderMessage {
          text-align: center;
          margin: 15px;
          font-size: 18px;
          font-weight: bold;
        }
    </style>
    <script>
        const URL="https://dummyjson.com/products?limit=10&skip=3";
        let INRrate=0;
        async function loadProduct(){
            try{
             const res= await fetch(URL);
             console.log("res=",res);
             const data= await res.json();
             console.log("data=",data.products);
             let rows='';
             data.products.map((i,index)=>(
                rows+=`
                <tr>
                    <td>${index+1}</td>
                    <td>${i.title}</td>
                    <td><img src=${i.images[0]} width=50px height=100px> </td>
                    <td>${i.category}</td>
                    <td>${i.rating}</td>
                    <td>₹${(i.price*INRrate).toFixed(2)}</td>
                    <td>${i.stock}</td>
                    <td><button onClick="addToCart(${i.product})">
                        Add to Cart
                        </button>
                    </td>
                </tr>
                `       
             ))
             const el=document.getElementById("data");
             el.innerHTML=rows;

            }catch(err){
                console.log("Error=",err);
            }
        }
        async function getRate(){
            const URL="https://open.er-api.com/v6/latest/USD";
            try{
              const res= await fetch(URL);
              const ratedata=await res.json();
              console.log("rate=",ratedata.rates.INR);
              return ratedata.rates.INR;
            }catch(err){
              console.log("Error:",err);
            }
        }
        let cart = [];

        function addToCart(id) {
          cart.push(id);
          const message = document.getElementById("message");
          message.innerText = "Product added to cart!";
        }
        function placeOrder() {
           const message = document.getElementById("orderMessage");

          if (cart.length === 0) {
            message.innerText = "Your cart is empty!";
          } else {
            message.innerText = "Order placed successfully!";
          }
        }
        const test=async()=>{
        INRrate= await getRate();
        console.log("INRrate=",INRrate);
        loadProduct();
        }
        test();
        
    </script>
</head>
<body>
    <h1><center>List of Products</center></h1>
    <div id="message"></div>
   <table>
    <thead>
        <tr>
            <th>Sr.No</th>
            <th>Title</th>
            <th>Image</th>
            <th>Category</th>
            <th>Rating</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Cart</th>
        </tr>
    </thead>
    <tbody id="data">

    </tbody>
   </table>
   <div id="orderMessage"></div>
   <button onclick="placeOrder()">Place Order</button>
</body>
</html>
